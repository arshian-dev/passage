services:
  # 1. Python FastAPI Backend with Tesseract OCR & Neon PostgreSQL
  - type: web
    name: passage-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false

  # 2. Next.js Frontend Web Application
  - type: web
    name: passage-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
